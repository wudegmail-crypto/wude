name: Build 公文格式处理工具 (Kylin)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doc_formatter.py'
      - '.github/workflows/build_doc_formatter.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in glibc 2.31 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            python:3.9-slim-bullseye bash -c '
              set -e
              echo "=== 环境 ==="
              python --version
              ldd --version 2>/dev/null | head -1

              echo "=== 安装系统依赖 ==="
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                tk tcl libx11-6 binutils

              echo "=== 安装 Python 依赖 ==="
              pip install --quiet python-docx customtkinter pyinstaller

              echo "=== 检查依赖 ==="
              python -c "import tkinter; import docx; import customtkinter; import PyInstaller; print(\"ALL OK\")"

              echo "=== PyInstaller 打包 ==="
              rm -rf build dist *.spec 2>/dev/null || true
              pyinstaller --onefile --name doc_formatter_kylin \
                --hidden-import tkinter --hidden-import _tkinter \
                --hidden-import customtkinter \
                --hidden-import docx \
                --hidden-import PIL --hidden-import PIL._imagingtk --hidden-import PIL._tkinter_finder \
                --clean --noconfirm doc_formatter.py

              echo "=== 输出 ==="
              ls -lh dist/
            '

      - name: Verify glibc compatibility
        run: |
          echo "=== GLIBC 版本要求 ==="
          strings dist/doc_formatter_kylin | grep "GLIBC_" | sort -Vu
          echo "=== 文件信息 ==="
          file dist/doc_formatter_kylin
          ls -lh dist/doc_formatter_kylin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc_formatter_kylin
          path: dist/doc_formatter_kylin
